name: Bug report
description: Report a reproducible CNC Route Studio problem using synthetic data.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Please do not include production NC files, customer details, or machine-specific secrets."
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v1.15.0 or commit hash
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
      placeholder: Firefox on Linux, Chrome on Windows, etc.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal synthetic reproduction
      description: Include a small synthetic G-code example and steps to reproduce.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual results
    validations:
      required: true
